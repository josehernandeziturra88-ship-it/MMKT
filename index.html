<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi Market · Cada visita, una oportunidad</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0f4;color:#172238;font-family:Inter,Arial,sans-serif}button,a,input{font:inherit}button{cursor:pointer}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;background:white;border-bottom:1px solid #dce0e8}.brand{font-weight:900;font-size:22px;letter-spacing:-1px}.brand b{color:#d91b39}header small{color:#6c7280}main{max-width:1280px;margin:30px auto;padding:0 24px}.slide{background:white;min-height:600px;border-radius:22px;padding:48px;box-shadow:0 16px 55px #1722380c;position:relative}.eyebrow{font-size:13px;letter-spacing:2px;color:#d91b39;font-weight:bold}h1{font-size:clamp(30px,4vw,56px);line-height:1.06;letter-spacing:-2px;max-width:850px;margin:24px 0}p.lead{font-size:22px;color:#687184;line-height:1.45;max-width:850px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:32px 0}.card{background:#f4f6fa;padding:25px;border-radius:14px;font-size:19px;line-height:1.5;border-top:3px solid #d91b39}.num{display:block;color:#d91b39;font-size:13px;font-weight:800;margin-bottom:16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0;flex-wrap:wrap}button,.ref{border:1px solid #dce0e8;background:white;color:#172238;padding:11px 17px;border-radius:9px;text-decoration:none}.primary{background:#d91b39;color:white;border-color:#d91b39}button:disabled{opacity:.35;cursor:default}.progress{height:4px;background:#dce0e8}.progress span{display:block;height:100%;background:#d91b39}#notes{background:#fff7e9;padding:24px;border-radius:12px;line-height:1.6}#notes[hidden]{display:none}.quiz{display:grid;gap:12px;max-width:900px;margin:30px 0}.quiz button{text-align:left;font-size:19px;padding:20px}.quiz .ok{background:#e0f4eb;border-color:#168653}.quiz .bad{background:#fff1f0;border-color:#c33939}.feedback{padding:16px;background:#edf6f2;border-radius:10px;line-height:1.5}.check{display:block;margin:16px 0;padding:18px;background:#f4f6fa;border-radius:12px;font-size:21px}.check input{width:22px;height:22px;margin-right:14px;accent-color:#d91b39}dialog{width:95vw;max-width:1400px;border:0;border-radius:12px;padding:20px}dialog::backdrop{background:#10182be0}dialog img{width:100%;display:block;margin-top:12px}.menu{display:grid;gap:8px;max-height:70vh;overflow:auto}.menu button{text-align:left}.hint{color:#697387;font-size:13px}.print-slide{break-after:page;padding:40px}.print-slide h1{font-size:36px}body.present header,body.present .hint{display:none}body.present main{margin-top:15px}button:focus-visible,a:focus-visible{outline:3px solid #1979c9;outline-offset:3px}@media(max-width:700px){header small{display:none}.slide{padding:26px;min-height:65vh}.cards{grid-template-columns:1fr}main{padding:0 12px;margin:14px auto}h1{letter-spacing:-1px}}@media print{header,.toolbar,.hint,.progress,dialog,#notes{display:none!important}main{margin:0;padding:0}.slide{box-shadow:none;padding:0;min-height:0}.cards{grid-template-columns:1fr 1fr}.print-slide{break-after:page}.print-slide:last-child{break-after:auto}@page{size:landscape;margin:15mm}}</style><header><div class="brand">mi <b>market</b> <span style="font-weight:400">/ Academia comercial</span></div><small>Capacitación de vendedores · Versión de revisión</small></header><main><div class="toolbar"><button id="index">☰ Temas</button><div><button id="toggleNotes">Notas del facilitador</button> <button id="full">Pantalla completa</button> <button id="print">Imprimir / PDF</button></div></div><article id="slide" class="slide" aria-live="polite"></article><div class="toolbar"><button id="prev">← Anterior</button><span id="counter"></span><button class="primary" id="next">Siguiente →</button></div><div class="progress"><span id="bar"></span></div><p class="hint">← → para avanzar · N para notas · Ejercicios educativos, sin conexión a sistemas reales. Fuente: Mi Market - General (1).pdf.</p><aside id="notes" hidden></aside></main><dialog id="modal"><button id="close">Cerrar ✕</button><div id="modalBody"></div></dialog><script>const slides=[{"section": "BIENVENIDA", "title": "Cada visita, una oportunidad.", "lead": "Mi Market · Capacitación para vendedores", "items": ["Prepara tu ruta con información actualizada.", "Detecta oportunidades en cada cliente.", "Registra, confirma y da seguimiento."], "page": 1, "note": "Duración sugerida: 35–45 minutos. Pregunta al grupo qué tarea les cuesta más. Los ejercicios son educativos y no generan pedidos reales.", "kind": "", "q": null}, {"section": "TU RECORRIDO", "title": "De la preparación al seguimiento", "lead": "Una ruta de aprendizaje conectada con tu día.", "items": ["01 · Preparar: acceso, seguridad y descarga.", "02 · Visitar: cartera, misiones y oportunidades.", "03 · Vender: pedido, descuentos y confirmación.", "04 · Resolver: entregas, equipos y requerimientos."], "page": 2, "note": "Explica el objetivo: completar una visita y reconocer cuándo quedó gestionada.", "kind": "", "q": null}, {"section": "01 · PREPARAR", "title": "Antes de salir, deja todo listo", "lead": "La preparación comienza con tu dispositivo.", "items": ["Correo corporativo activo y contraseña vigente.", "Intune / Portal de Empresas y Authenticator actualizados.", "Huella configurada y ruta verificada."], "page": 4, "note": "El material indica cambio de contraseña cada tres meses. Validar la política vigente con TI antes de impartir la capacitación.", "kind": "", "q": null}, {"section": "01 · PREPARAR", "title": "Comprueba el estado de Intune", "lead": "Una revisión breve antes de comenzar.", "items": ["Abre Intune o Portal de Empresas.", "Selecciona tu equipo y revisa la fecha de comprobación.", "Si no está actualizada al mes en curso, pulsa «Comprobar configuración del dispositivo»."], "page": 3, "note": "Pide a una persona que explique dónde revisaría el estado del dispositivo. No mostrar credenciales en pantalla.", "kind": "", "q": null}, {"section": "01 · PREPARAR", "title": "Descarga los datos de tu ruta", "lead": "Haz la carga antes de salir.", "items": ["Conéctate a internet y realiza la carga del día.", "El material indica mantener conexión al menos 3 minutos.", "La carga incluye los clientes de toda la ruta."], "page": 5, "note": "Confirma la ruta antes de descargar. El material menciona un aviso al abrir un cliente del listado «Todos», pero no especifica su contenido; evitar inventarlo.", "kind": "", "q": null}, {"section": "01 · PREPARAR", "title": "¿Listo para salir?", "lead": "Marca los pasos que ya verificaste.", "items": ["Correo y acceso operativos", "Estado de Intune revisado", "Huella configurada y ruta correcta", "Carga del día realizada con internet"], "page": 5, "note": "Actividad: cada participante comprueba los cuatro puntos. Esta lista no consulta el estado real del dispositivo.", "kind": "check", "q": null}, {"section": "02 · VISITAR", "title": "Empieza con una visión del día", "lead": "Prioriza con información de metas y entregas.", "items": ["Consulta el avance de presupuesto y la tendencia en Power BI.", "Revisa las entregas programadas y su estado.", "Usa el buscador y consulta la información de transporte."], "page": 6, "note": "Pide que identifiquen qué entrega o cliente revisarían primero. No confundir tendencia con resultado confirmado.", "kind": "", "q": null}, {"section": "02 · VISITAR", "title": "Encuentra al cliente que necesita gestión", "lead": "Los filtros ayudan a priorizar tu cartera.", "items": ["No gestionados: sin pedido ni motivo de no venta ingresado por Mi Market.", "Sin compra: sin compra ingresada por Mi Market.", "Con compra: clientes con compra registrada."], "page": 7, "note": "Las compras del mes mostradas no incluyen Order Entry / Call Center, según el material. Explica que «sin compra» y «no gestionado» no significan lo mismo.", "kind": "", "q": null}, {"section": "02 · VISITAR", "title": "Lee las señales antes de actuar", "lead": "La ficha del cliente entrega contexto.", "items": ["Distingue bloqueo parcial de bloqueo general / suspendido.", "Revisa misiones guiadas y estado del censo de equipos de frío.", "Consulta NPS, datos de registro y dirección del cliente."], "page": 9, "note": "El material muestra NPS satisfecho, neutro e insatisfecho. La dirección permite redireccionamiento. Los iconos exactos deben revisarse en las capturas originales.", "kind": "", "q": null}, {"section": "02 · VISITAR", "title": "Convierte una misión en una acción", "lead": "Revisa, acepta y guarda las misiones asignadas por RTM.", "items": ["Cliente nuevo en ruta o cliente sin compra con equipo de frío.", "Oportunidades de instalación de equipos de frío.", "Oportunidades de venta por segmentos."], "page": 10, "note": "La campana indica misiones pendientes. Pide un ejemplo de la acción que harían con un cliente sin compra.", "kind": "", "q": null}, {"section": "02 · VISITAR", "title": "Amplía el surtido con intención", "lead": "Combinadas y Foto de éxito muestran oportunidades.", "items": ["Revisa los productos faltantes y el avance.", "En Combinadas, consulta también el avance por categoría.", "Agrega o elimina productos del carrito según la oportunidad."], "page": 11, "note": "Abre la captura original y pide identificar un producto que aportarían al pedido. No inventar porcentajes ni coberturas.", "kind": "", "q": null}, {"section": "03 · VENDER", "title": "Arma el pedido desde lo habitual", "lead": "El pedido sugerido facilita la conversación.", "items": ["Parte de los formatos y volúmenes que el cliente compra habitualmente.", "Evalúa complementos según clientes similares y nuevos desarrollos.", "Ajusta la propuesta con el cliente antes de confirmar."], "page": 21, "note": "Actividad: «¿Qué repondrías primero y qué complemento ofrecerías?». El sugerido es apoyo para la venta, no una confirmación automática.", "kind": "", "q": null}, {"section": "03 · VENDER", "title": "Revisa descuentos y condiciones", "lead": "Aclara las condiciones antes de cerrar.", "items": ["Clickeables: activa o desactiva descuentos en línea.", "Pulsa aceptar y guardar después de la selección.", "Consulta las vías de pago y los montos disponibles por categoría."], "page": 12, "note": "La captura de vías de pago está en la página 13 del original. Validar la vigencia de descuentos y condiciones con el equipo responsable.", "kind": "", "q": null}, {"section": "03 · VENDER", "title": "Cierra el pedido con certeza", "lead": "Ingresar el pedido y confirmarlo son momentos distintos.", "items": ["Puedes ingresar una orden de compra que se reflejará en la factura.", "Confirma el pedido y obtén su número.", "Pide al cliente confirmar en Mi Andina para que sea un pedido digital."], "page": 20, "note": "El material indica un mínimo de $30.000 por fecha de entrega para congelados y no congelados. Validar vigencia y aplicación comercial. Un pedido ingresado por Mi Market y no validado por el cliente es análogo, según el PDF.", "kind": "", "q": null}, {"section": "PRÁCTICA", "title": "¿Este pedido ya es digital?", "lead": "Ingresaste y confirmaste el pedido en Mi Market, pero el cliente aún no lo confirma en Mi Andina.", "items": [], "page": 20, "note": "Deja que el grupo responda y explique el criterio antes de mostrar la solución.", "kind": "quiz", "q": {"options": ["Sí, porque ya tiene número de pedido.", "No; falta la confirmación del cliente en Mi Andina.", "Sí, si se usó el pedido sugerido."], "correct": 1, "feedback": "Falta la confirmación del cliente en Mi Andina. Según el material, sin esa validación el pedido es análogo."}}, {"section": "03 · VENDER", "title": "Si no hay venta, registra el motivo", "lead": "La visita también debe quedar gestionada.", "items": ["Ingresa a la ficha del cliente.", "Selecciona el motivo de no venta.", "Pulsa «Guardar y continuar»."], "page": 19, "note": "Un cliente del día se considera gestionado si tiene pedido o motivo de no venta ingresado por Mi Market. La barra de gestionados refleja el avance.", "kind": "", "q": null}, {"section": "04 · RESOLVER", "title": "Sigue lo que ya se vendió", "lead": "Consulta pedidos realizados de los últimos 60 días.", "items": ["Revisa el estado, el detalle y los productos.", "Puedes repetir pedidos desde el historial.", "Puedes cancelar pedidos que no se hayan cuotificado."], "page": 16, "note": "La condición de cancelación se conserva literalmente del PDF: «no se hayan cuotificado». Confirmar su significado operativo con el responsable; no sustituir por «no despachados».", "kind": "", "q": null}, {"section": "04 · RESOLVER", "title": "Gestiona los equipos de frío", "lead": "El censo y el retiro tienen pasos distintos.", "items": ["Consulta los equipos cargados al cliente en SAP.", "Censa los equipos encontrados; los no censados se enviarán como «Equipo no encontrado».", "Si no puedes censar, registra un motivo de no censo."], "page": 15, "note": "Retiro: crear oferta asociada al cliente → aprobación de jefatura en SAP → coordinadora crea solicitud de retiro en SAP. El PDF indica gris para clientes censados. EDF = equipos de frío.", "kind": "", "q": null}, {"section": "04 · RESOLVER", "title": "Crea requerimientos que se puedan resolver", "lead": "El historial muestra los últimos 30 días.", "items": ["Incluye todos los detalles necesarios para atender el caso.", "Para servicio técnico: código y contacto del cliente.", "Agrega horario, referencias, marca, serie del equipo y motivo."], "page": 18, "note": "El original indica cuatro tipos de requerimiento, pero no los enumera en el texto. Revisar los tipos vigentes en la aplicación antes de enseñarlos.", "kind": "", "q": null}, {"section": "PRÁCTICA", "title": "Te quedaste sin internet. ¿Qué haces?", "lead": "Ya realizaste la carga del día. Necesitas registrar una visita sin venta.", "items": [], "page": 23, "note": "Pide justificar la respuesta. No extender la lista offline a funciones que el material no incluye.", "kind": "quiz", "q": {"options": ["Registro el motivo de no venta.", "Confirmo que todas las funciones están disponibles sin conexión.", "Asumo que también puedo completar cualquier pedido."], "correct": 0, "feedback": "El material incluye el registro de motivos de no venta sin conexión. También permite acceso biométrico, cartera, información básica y programación de entrega."}}, {"section": "04 · RESOLVER", "title": "Sin conexión: conoce el alcance", "lead": "Funciones offline descritas en el material.", "items": ["Acceso con datos biométricos y cartera de clientes.", "Información básica de clientes y programación de entrega.", "Registro de motivos de no venta."], "page": 23, "note": "La descarga previa es parte de la preparación del día. No prometer toma o confirmación de pedidos offline: no están listadas en el PDF.", "kind": "", "q": null}, {"section": "CIERRE", "title": "Una buena visita deja un próximo paso", "lead": "Recorre el ciclo completo con tu equipo.", "items": ["Prepara: acceso, ruta y carga del día.", "Visita: revisa señales, misiones y oportunidades.", "Gestiona: confirma el pedido o registra el motivo de no venta.", "Da seguimiento: entrega, equipos o requerimientos."], "page": null, "note": "Cierre: cada participante explica qué hará distinto en su próxima ruta. Repasa las preguntas que quedaron pendientes y valida con el equipo las reglas comerciales vigentes.", "kind": "", "q": null}];let idx=0,notes=false;const answers={},checks={};const $=s=>document.querySelector(s);function render(){const s=slides[idx];$('#counter').textContent=`${String(idx+1).padStart(2,'0')} / ${slides.length}`;$('#bar').style.width=((idx+1)/slides.length*100)+'%';$('#prev').disabled=idx===0;$('#next').disabled=idx===slides.length-1;let body='';if(s.kind==='quiz'){body='<div class="quiz">'+s.q.options.map((o,j)=>`<button data-answer="${j}" class="${answers[idx]===j?(j===s.q.correct?'ok':'bad'):''}">${o}</button>`).join('')+'</div>';if(answers[idx]!==undefined)body+=`<p class="feedback" role="status">${answers[idx]===s.q.correct?'✓ Exacto.':'Revisemos el criterio.'} ${s.q.feedback}</p>`;}else if(s.kind==='check'){body=s.items.map((t,j)=>`<label class="check"><input type="checkbox" data-check="${j}" ${checks[idx+'-'+j]?'checked':''}>${t}</label>`).join('');}else{body='<div class="cards">'+s.items.map((t,j)=>`<div class="card"><span class="num">${String(j+1).padStart(2,'0')}</span>${t}</div>`).join('')+'</div>';}$('#slide').innerHTML=`<div class="eyebrow">${s.section}</div><h1>${s.title}</h1><p class="lead">${s.lead}</p>${body}${s.page?'<button id="source">↗ Ampliar captura original · p. '+s.page+'</button>':''}`;$('#notes').textContent=s.note;$('#notes').hidden=!notes;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[idx]=+b.dataset.answer;render()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>checks[idx+'-'+b.dataset.check]=b.checked);if($('#source'))$('#source').onclick=()=>{$('#modalBody').innerHTML=`<img alt="Página ${s.page} del material original Mi Market" src="recursos/original-${String(s.page).padStart(2,'0')}.png">`;$('#modal').showModal()};location.hash=idx+1;}function move(n){idx=Math.max(0,Math.min(slides.length-1,idx+n));render()}$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#toggleNotes').onclick=()=>{notes=!notes;render()};$('#close').onclick=()=>$('#modal').close();$('#index').onclick=()=>{$('#modalBody').innerHTML='<h2>Elige un tema</h2><div class="menu">'+slides.map((s,j)=>`<button data-go="${j}">${j+1}. ${s.title}</button>`).join('')+'</div>';$('#modal').showModal();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{idx=+b.dataset.go;$('#modal').close();render()})};$('#full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{});document.body.classList.add('present')}else{document.exitFullscreen?.();document.body.classList.remove('present')}};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('present')});document.addEventListener('keydown',e=>{if($('#modal').open||['INPUT','BUTTON'].includes(document.activeElement.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key.toLowerCase()==='n'){notes=!notes;render()}});window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(n>=1&&n<=slides.length&&n-1!==idx){idx=n-1;render()}});$('#print').onclick=()=>{const box=document.createElement('div');box.id='printAll';box.innerHTML=slides.map(s=>`<section class="print-slide"><div class="eyebrow">${s.section}</div><h1>${s.title}</h1><p class="lead">${s.lead}</p><div class="cards">${s.items.map(t=>'<div class="card">'+t+'</div>').join('')}</div>${s.q?'<p>'+s.q.options.join('<br>')+'</p>':''}</section>`).join('');$('#slide').hidden=true;document.querySelector('main').appendChild(box);window.print();box.remove();$('#slide').hidden=false};idx=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1))||1)-1));render();</script></html>
