oom-0.jpg", "recursos/lamina-12-paso-10-zoom-1.jpg"]]}, {"number": 13, "title": "Clickeables", "hidden": false, "frames": ["recursos/lamina-13-paso-00.jpg", "recursos/lamina-13-paso-01.jpg", "recursos/lamina-13-paso-02.jpg"], "labels": ["Vista inicial", "Activar o", "Cantidad de clickeables"], "overview": "recursos/lamina-13-paso-02.jpg", "zooms": [], "sourceText": "CLICKEABLES\nCantidad de clickeables\nactivos\nActivar o\ndesactivar\ndescuentos\nen línea\nAceptar\ny guardar", "frameZooms": [[], [], []]}, {"number": 14, "title": "Descuentos de negociación", "hidden": true, "frames": ["recursos/lamina-14-paso-00.jpg", "recursos/lamina-14-paso-01.jpg", "recursos/lamina-14-paso-02.jpg", "recursos/lamina-14-paso-03.jpg", "recursos/lamina-14-paso-04.jpg"], "labels": ["Vista inicial", "Bloque 1", "Bloque 2", "Bloque 3", "Bloque 4"], "overview": "recursos/lamina-14-paso-04.jpg", "zooms": [], "sourceText": "¿Qué son los descuentos de negociación?\nUna herramienta para rutas especializadas de vinos, cervezas, licores y otros grupos definidos.\nAsignados por el vendedor\nEl porcentaje se selecciona desde Mi Market y se aplica al pedido en curso.\nPor grupo de materiales\nEl descuento alcanza los SKU del grupo que están en el carrito al cerrar la negociación.\nVisibles para el cliente\nMi Andina muestra los precios descontados, pero bloquea las modificaciones de cantidad.\nRegla principal\nUn mismo producto no puede recibir más de un porcentaje de descuento de negociación.\nERROR SI SE DUPLICA EL %\n14\nNEGOCIABLES", "frameZooms": [[], [], [], [], []]}, {"number": 15, "title": "Negociables · paso a paso", "hidden": true, "frames": ["recursos/lamina-15-paso-00.jpg", "recursos/lamina-15-paso-01.jpg", "recursos/lamina-15-paso-02.jpg", "recursos/lamina-15-paso-03.jpg", "recursos/lamina-15-paso-04.jpg"], "labels": ["Vista inicial", "Bloque 1", "Bloque 2", "Bloque 3", "Bloque 4"], "overview": "recursos/lamina-15-paso-04.jpg", "zooms": [], "sourceText": "Paso a paso del vendedor\nLa asignación se realiza al preparar el pedido en Mi Market.\n1\nAgrega al menos un SKU\nEl negociable se habilita cuando existen productos en el carrito.\n2\nAbre “Negociables”\nVisualiza los grupos disponibles para el cliente.\n3\nSelecciona el porcentaje\nEscoge una única alternativa y aplica el descuento.\n4\nCompleta el pedido\nAñade SKU antes o después de aplicar la negociación.\n15\nNEGOCIABLES", "frameZooms": [[], [], [], [], []]}, {"number": 16, "title": "Negociables en Mi Andina", "hidden": true, "frames": ["recursos/lamina-16-paso-00.jpg", "recursos/lamina-16-paso-01.jpg", "recursos/lamina-16-paso-02.jpg", "recursos/lamina-16-paso-03.jpg"], "labels": ["Vista inicial", "Los productos negociados se muestran protegidos dentro del pedido colaborat", "El botón para agregar o modificar cantidades aparece deshabilitado para tod", "SOLO EL VENDEDOR MODIFICA"], "overview": "recursos/lamina-16-paso-03.jpg", "zooms": [], "sourceText": "Experiencia del cliente en Mi Andina\nLos productos negociados se muestran protegidos dentro del pedido colaborativo.\nEl botón para agregar o modificar cantidades aparece deshabilitado para todo el grupo de productos.\nSOLO EL VENDEDOR MODIFICA\n16\nNEGOCIABLES", "frameZooms": [[], [], [], []]}, {"number": 17, "title": "Reglas de negociación", "hidden": true, "frames": ["recursos/lamina-17-paso-00.jpg", "recursos/lamina-17-paso-01.jpg", "recursos/lamina-17-paso-02.jpg", "recursos/lamina-17-paso-03.jpg", "recursos/lamina-17-paso-04.jpg", "recursos/lamina-17-paso-05.jpg", "recursos/lamina-17-paso-06.jpg", "recursos/lamina-17-paso-07.jpg", "recursos/lamina-17-paso-08.jpg"], "labels": ["Vista inicial", "Bloque 1", "Bloque 2", "Bloque 3", "Bloque 4", "Bloque 5", "Bloque 6", "Bloque 7", "Bloque 8"], "overview": "recursos/lamina-17-paso-08.jpg", "zooms": [], "sourceText": "Reglas importantes\nComportamientos que protegen la negociación durante el ciclo del pedido.\nUna sola tasa por producto\nNo se permiten dos porcentajes de DN sobre el mismo SKU.\nMás de un DN por pedido\nSe puede aplicar una negociación para vinos y otra para otra categoría.\nSin mínimos obligatorios\nNo existen SKU obligatorios ni cantidades mínimas para activar el DN.\nCliente puede borrar los productos\nEn Mi Andina, al eliminar un SKU relacionado, se advierte y se retiran los productos del grupo\nEl DN es para un grupo de productos\nEl DN se aplica para todo el grupo de productos que tiene el descuento.\nCorte limpia el borrador\nSi el pedido no se confirma antes del corte, el carrito se elimina.\n17\nFuncionalidad del DN\nEl descuento de negociación solo aparece cuando el cliente tiene cargado el descuento en SAP.\nEdición de pedido en Mi Andina\nEl cliente no puede editar pedidos que tienen productos con DN.\nNEGOCIABLES", "frameZooms": [[], [], [], [], [], [], [], [], []]}, {"number": 18, "title": "Validaciones posteriores", "hidden": true, "frames": ["recursos/lamina-18-paso-00.jpg", "recursos/lamina-18-paso-01.jpg", "recursos/lamina-18-paso-02.jpg", "recursos/lamina-18-paso-03.jpg"], "labels": ["Vista inicial", "Bloque 1", "Bloque 2", "Bloque 3"], "overview": "recursos/lamina-18-paso-03.jpg", "zooms": [], "sourceText": "Validaciones posteriores\nEl pedido confirmado conserva trazabilidad en B2B y SAP.\nCarrito y B2B\nSe visualizan el precio ajustado y el descuento total. Las cantidades enviadas por el vendedor permanecen bloqueadas.\nSAP\nLas posiciones con DN llegan bloqueadas y mantienen el porcentaje asignado.\nCombinación de beneficios\nEl documento valida DN y descuento escalonado aplicados correctamente sobre un mismo producto.\nEl DN se aplica a todos los productos elegibles que estén en el carrito al momento de cerrar la negociación.\n18\nNEGOCIABLES", "frameZooms": [[], [], [], []]}, {"number": 19, "title": "Vías de pago y saldos", "hidden": false, "frames": ["recursos/lamina-19-paso-00.jpg", "recursos/lamina-19-paso-01.jpg", "recursos/lamina-19-paso-02.jpg", "recursos/lamina-19-paso-03.jpg", "recursos/lamina-19-paso-04.jpg"], "labels": ["Vista inicial", "Puedes visualizar las vías de pago y montos disponibles", "Desglose por categoría de productos", "Demostración · paso 2", "Demostración · paso 3"], "overview": "recursos/lamina-19-paso-04.jpg", "zooms": ["recursos/lamina-19-ampliacion-1.jpg"], "sourceText": "Puedes visualizar las vías de pago y montos disponibles \nVÍAS DE PAGO Y SALDOS\nDesglose por categoría de productos", "frameZooms": [["recursos/lamina-19-paso-00-zoom-0.jpg"], ["recursos/lamina-19-paso-01-zoom-0.jpg"], ["recursos/lamina-19-paso-02-zoom-0.jpg"], ["recursos/lamina-19-paso-03-zoom-0.jpg"], ["recursos/lamina-19-paso-04-zoom-0.jpg"]]}, {"number": 20, "title": "Equipos de frío · retiro", "hidden": false, "frames": ["recursos/lamina-20-paso-00.jpg", "recursos/lamina-20-paso-01.jpg", "recursos/lamina-20-paso-02.jpg", "recursos/lamina-20-paso-03.jpg", "recursos/lamina-20-paso-04.jpg", "recursos/lamina-20-paso-05.jpg"], "labels": ["Vista inicial", "Listado y Retiro de EDF", "Demostración · paso 2", "Demostración · paso 3", "Demostración · paso 4", "Demostración · paso 5"], "overview": "recursos/lamina-20-paso-05.jpg", "zooms": ["recursos/lamina-20-ampliacion-1.jpg"], "sourceText": "\nVerás el listado de equipos de frío que tiene cargado el cliente en SAP.\nPuedes gestionar el retiro de equipos de frío mediante una solicitud de oferta asociada al cliente. \nLa oferta de retiro tiene que ser aprobado por tu jefatura en SAP\nSi tu jefatura aprueba la oferta de retiro, la coordinadora tiene que crear la solicitud de retiro en SAP\nEQUIPOS DE FRÍO\nListado y Retiro de EDF", "frameZooms": [["recursos/lamina-20-paso-00-zoom-0.jpg"], ["recursos/lamina-20-paso-01-zoom-0.jpg"], ["recursos/lamina-20-paso-02-zoom-0.jpg"], ["recursos/lamina-20-paso-03-zoom-0.jpg"], ["recursos/lamina-20-paso-04-zoom-0.jpg"], ["recursos/lamina-20-paso-05-zoom-0.jpg"]]}, {"number": 21, "title": "Nuevo equipo · acceso", "hidden": true, "frames": ["recursos/lamina-21-paso-00.jpg", "recursos/lamina-2 4-paso-03.jpg", "zooms": ["recursos/lamina-34-ampliacion-1.jpg"], "sourceText": "Mi Market funciona sin conexión a internet\n\n\nAcceso con datos biométricos\nCartera de clientes\nInformación básica de clientes \nProgramación de entrega\nRegistrar motivos de no venta", "frameZooms": [["recursos/lamina-34-paso-00-zoom-0.jpg"], ["recursos/lamina-34-paso-01-zoom-0.jpg"], ["recursos/lamina-34-paso-02-zoom-0.jpg"], ["recursos/lamina-34-paso-03-zoom-0.jpg"]]}, {"number": 35, "title": "Pedidos offline · condiciones", "hidden": true, "frames": ["recursos/lamina-35-paso-00.jpg", "recursos/lamina-35-paso-01.jpg", "recursos/lamina-35-paso-02.jpg", "recursos/lamina-35-paso-03.jpg", "recursos/lamina-35-paso-04.jpg", "recursos/lamina-35-paso-05.jpg", "recursos/lamina-35-paso-06.jpg", "recursos/lamina-35-paso-07.jpg", "recursos/lamina-35-paso-08.jpg", "recursos/lamina-35-paso-09.jpg"], "labels": ["Vista inicial", "Bloque 1", "Bloque 2", "Bloque 3", "Bloque 4", "Bloque 5", "Bloque 6", "Bloque 7", "Bloque 8", "Bloque 9"], "overview": "recursos/lamina-35-paso-09.jpg", "zooms": [], "sourceText": "Pedidos sin conexión\n9 cosas que debes tener en cuenta al trabajar sin conexión\n1\nSolo podrás ingresar un pedido sin conexión para clientes del día\n2\nNo dejar productos en el carrito de compras. Siempre cerrar el pedido\n3\nEl pedido quedará ingresado por el vendedor. Esto disminuye el NSR digital\n4\nNo permite pedido colaborativo porque no hay internet\n5\nSolo verás precio base. En SAP llegarán los descuentos de combos, volumen y clickeables asignados antes de perder la conexión\n\n6\nPedido mínimo se valida en cada pedido\n7\nSi el cliente tiene vía de pago C o R + Efectivo y el pedido es mayor al disponible, el pedido saldrá en Efectivo\n8\nSi no tenemos conexión no se debe borrar caché porque se pierden los datos (pedidos y motivos de no venta)\n9\nEn modo avión no funciona el pedido sin conexión\nCLIENTES DEL DÍA\nCIERRA EL PEDIDO\nDISMINUCIÓN DE NSR DIGITAL\nSIN PEDIDO COLABORATIVO\nSIN DESCUENTOS\nPEDIDO MÍNIMO\nALERTA EN VÍAS DE PAGO\nNO BORRAR CACHÉ\nMODO AVIÓN NO COMPATIBLE", "frameZooms": [[], [], [], [], [], [], [], [], [], []]}, {"number": 36, "title": "Pedidos offline · alcance", "hidden": true, "frames": ["recursos/lamina-36-paso-00.jpg", "recursos/lamina-36-paso-01.jpg", "recursos/lamina-36-paso-02.jpg", "recursos/lamina-36-paso-03.jpg"], "labels": ["Vista inicial", "Con conexión", "Sin conexión", "Acceso con datos biométricos"], "overview": "recursos/lamina-36-paso-03.jpg", "zooms": [], "sourceText": "Pedidos sin conexión\nCon conexión\nSin conexión\nAcceso con datos biométricos\nCartera de clientes\nInformación básica de clientes \nProgramación de entrega\nRegistrar motivos de no venta\nIngresar un pedido sin conexión", "frameZooms": [[], [], [], []]}, {"number": 37, "title": "Pedidos offline · ingreso", "hidden": true, "frames": ["recursos/lamina-37-paso-00.jpg", "recursos/lamina-37-paso-01.jpg"], "labels": ["Vista inicial", "Solo estará habilitado el pedido sin conexión"], "overview": "recursos/lamina-37-paso-01.jpg", "zooms": [], "sourceText": "Pedidos sin conexión\nSolo estará habilitado el pedido sin conexión\nEn la parte superior te avisará que estás sin conexión\nEl pedido quedará en espera hasta que tengas conexión\nPedido en espera", "frameZooms": [[], []]}, {"number": 38, "title": "Pedidos offline · vías de pago", "hidden": true, "frames": ["recursos/lamina-38-paso-00.jpg", "recursos/lamina-38-paso-01.jpg", "recursos/lamina-38-paso-02.jpg", "recursos/lamina-38-paso-03.jpg", "recursos/lamina-38-paso-04.jpg"], "labels": ["Vista inicial", "Pedido < disponible", "Si tenemos vía de pago C o R + E", "Pedido > disponible", "Pedido sale en Efectivo"], "overview": "recursos/lamina-38-paso-04.jpg", "zooms": [], "sourceText": "Pedidos sin conexión\nSi tenemos vía de pago C o R + E\nComportamiento temporal de vías de pago\nPedido < disponible\n\nEn modo offline, Mi Market podría mostrar un medio de pago desactualizado al finalizar el pedido. Al recuperar conexión, se corrige automáticamente y se visualizan el número de pedido SAP y la vía de pago correcta.\nPedido > disponible\nPedido sale en Efectivo", "frameZooms": [[], [], [], [], []]}, {"number": 39, "title": "Pedidos offline · bitácora", "hidden": true, "frames": ["recursos/lamina-39-paso-00.jpg", "recursos/lamina-39-paso-01.jpg", "recursos/lamina-39-paso-02.jpg", "recursos/lamina-39-paso-03.jpg", "recursos/lamina-39-paso-04.jpg", "recursos/lamina-39-paso-05.jpg", "recursos/lamina-39-paso-06.jpg"], "labels": ["Vista inicial", "Seleccionar Mostrar o ", "Pedidos no creados porque el cliente tiene un bloqueo al recuperar internet", "Información de que hay un cambio pendiente", "Pedidos en espera a recuperar la conexión de internet", "Pedidos ingresados en SAP", "Te informamos que no tienes internet"], "overview": "recursos/lamina-39-paso-06.jpg", "zooms": [], "sourceText": "Pedidos sin conexión\nInformación de que hay un cambio pendiente\nSeleccionar Mostrar o \nbajar hasta Pedidos sin conexión y hacer clic sobre el módulo\nLista de bitácora\nPedidos no creados porque el cliente tiene un bloqueo al recuperar internet\nPedidos en espera a recuperar la conexión de internet\nPedidos en proceso de transmisión\nPedidos ingresados en SAP\nTe informamos que no tienes internet", "frameZooms": [[], [], [], [], [], [], []]}, {"number": 40, "title": "Bitácora al recuperar conexión", "hidden": true, "frames": ["recursos/lamina-40-paso-00.jpg", "recursos/lamina-40-paso-01.jpg", "recursos/lamina-40-paso-02.jpg", "recursos/lamina-40-paso-03.jpg"], "labels": ["Vista inicial", "Sin conexión", "Con conexión", "Con conexión"], "overview": "recursos/lamina-40-paso-03.jpg", "zooms": [], "sourceText": "Pedidos sin conexión\nLista de bitácora cuando vuelve el internet\nCon conexión\nSin conexión\nCon conexión", "frameZooms": [[], [], [], []]}, {"number": 41, "title": "Clientes habilitados offline", "hidden": true, "frames": ["recursos/lamina-41-paso-00.jpg", "re v><div class="grid">'+visible().map(o=>`<button class="tile" data-source="${o.i}"><img alt="" loading="lazy" src="${o.s.overview}"><small>${o.s.hidden?'Material de apoyo':'Recorrido original'} · ${o.s.number}</small><span>${esc(o.s.title)}</span></button>`).join('')+'</div>');$('#supportToggle').onchange=e=>{includeSupport=e.target.checked;if(!includeSupport&&slides[source].hidden)go(0);$('#dialog').close();menu()};document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{$('#dialog').close();go(+b.dataset.source)})}$('#menu').onclick=menu;$('#next').onclick=$('#scene').onclick=next;$('#prev').onclick=prev;$('#overview').onclick=()=>{overview=!overview;render()};$('#zoom').onclick=()=>{const s=slides[source],zi=overview?s.frames.indexOf(s.overview):step,zooms=s.frameZooms?.[zi]||s.zooms;dialog('Ampliación · '+s.title,zooms.length?'<div class="zooms">'+zooms.map(f=>'<img class="large" alt="Pantalla original ampliada" src="'+f+'">').join('')+'</div>':'<img class="large" alt="Lámina ampliada" src="'+(overview?s.overview:s.frames[step])+'">')};$('#help').onclick=()=>dialog('Cómo presentar','<p class="hint">Usa Continuar o las flechas para avanzar cada aparición. Page Down / Page Up cambian de lámina. Ver completa permite consultar el conjunto y regresar al paso. Proyectar activa pantalla completa.<br><br>El recorrido mantiene las 24 láminas activas del original. Puedes activar las otras 19 desde Temas como material complementario. Las demostraciones usan capturas de los videos originales, sin ejecutar operaciones reales en Mi Market.<br><br>Después de descargar, descomprime el paquete completo y conserva la carpeta recursos junto a Presentacion.html.</p>');$('#close').onclick=()=>$('#dialog').close();$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.().catch(()=>{});document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('full',!!document.fullscreenElement));document.addEventListener('keydown',e=>{if($('#dialog').open||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'){e.preventDefault();next()}if(e.key==='ArrowLeft'){e.preventDefault();prev()}if(e.key==='PageDown'){e.preventDefault();skip(1)}if(e.key==='PageUp'){e.preventDefault();skip(-1)}if(e.key===' '&&e.target===document.body){e.preventDefault();next()}});const hash=location.hash.slice(1).split('-');const n=+hash[0];if(n>=1&&n<=slides.length){source=n-1;includeSupport=hash.includes('apoyo')||slides[source].hidden;step=Math.max(0,Math.min(slides[source].frames.length-1,(+hash[1]||1)-1))}render();</script></html>
